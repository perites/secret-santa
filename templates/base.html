<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0e271d">
    <title>{% block title %}Secret Santa{% endblock %}</title>
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎁</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <!-- Decorations -->
    <ul class="lights" aria-hidden="true">
        {% for i in range(40) %}<li></li>{% endfor %}
    </ul>
    <div class="snow" aria-hidden="true">
        {% for i in range(16) %}<span class="snowflake">{{ loop.cycle('❄', '•', '❅', '•') }}</span>{% endfor %}
    </div>
    <div class="forest" aria-hidden="true"></div>

    <div id="message-area" class="toasts" aria-live="polite"></div>

    <div class="container">
        {% block content %}{% endblock %}
    </div>

    {% block scripts %}{% endblock %}
</body>

</html>
